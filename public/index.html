<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SKU Product Name Bot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 40px;
    }
    .card {
      max-width: 720px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
    }
    h1 { margin-top: 0; }
    p { color: #cbd5e1; line-height: 1.5; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      margin-top: 12px;
      font-size: 16px;
    }
    input {
      background: #020617;
      color: #e5e7eb;
    }
    button {
      background: #f5c542;
      color: #111827;
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { opacity: .9; }
    .small { font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SKU Product Name Bot</h1>
    <p>
      Upload je stock CSV met kolommen <b>SKU</b> en <b>Size</b>.
      De bot zoekt de SKU in Airtable SKU Master en downloadt automatisch een nieuwe CSV met <b>Product Name</b>.
    </p>

    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept=".csv" required />
      <button type="submit">Upload & Download Enriched CSV</button>
    </form>

    <p class="small">
      Output kolommen: SKU, Size, Product Name, Match Status.
    </p>
  </div>
</body>
</html>
