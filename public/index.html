<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SKU Keyword Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 40px;
    }
    .card {
      max-width: 760px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
    }
    h1 { margin-top: 0; }
    p { color: #cbd5e1; line-height: 1.5; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      margin-top: 12px;
      font-size: 16px;
    }
    input { background: #020617; color: #e5e7eb; }
    button {
      background: #f5c542;
      color: #111827;
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { opacity: .9; }
    .small { font-size: 13px; color: #94a3b8; }
    code { color: #f5c542; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SKU Keyword Generator</h1>
    <p>
      Upload een CSV met minimaal <code>SKU</code> en <code>Size</code>.
      De tool zoekt de Product Name in Airtable en geeft een CSV terug met extra kolommen:
      <code>Product Name</code>, <code>Keywords</code> en <code>Match Status</code>.
    </p>

    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept=".csv" required />
      <button type="submit">Upload & Download CSV</button>
    </form>

    <p class="small">
      Voorbeeld output keyword: “samba core black 43” of “1906a tech explosion 42.5”.
    </p>
  </div>
</body>
</html>
